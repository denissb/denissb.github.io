name: Publish

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno environment
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.x
      
      - name: Setup Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/_config.ts', '**/deno.json') }}

      - name: Build site
        run: |
          deno task build --location=https://denissb.github.io/
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          build_dir: ./_site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
